[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snagtrace"
version = "0.1.0"
description = "Deterministic fault detection for AI agent execution traces: loops, tool-argument errors, and cost runaways, localized to the exact step."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "snagtrace contributors" }]
keywords = ["ai-agents", "observability", "debugging", "llm", "root-cause-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.2.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
snagtrace = "snagtrace.report.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/snagtrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["UP045"]  # Optional[X] kept deliberately for >=3.9 style consistency

[tool.ruff.lint.per-file-ignores]
"src/snagtrace/report/html.py" = ["E501"]  # embedded CSS/HTML template lines
